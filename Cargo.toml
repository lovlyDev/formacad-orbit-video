[package]
name = "orbit-video"
version = "1.0.0"
edition = "2021"
description = "FormaCAD plugin: turntable video of the model"
license = "MIT"
repository = "https://github.com/lovlyDev/formacad-orbit-video"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = { version = "0.63", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
